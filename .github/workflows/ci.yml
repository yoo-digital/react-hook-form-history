name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Locked in .github/workflows/actions.lock: rerun `gh actions-lock` after editing any `uses:`.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # pnpm from `packageManager`, Node.js from .nvmrc, then `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
      - run: pnpm -r check:pkg

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm -F e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
